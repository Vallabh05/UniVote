<!DOCTYPE html>
<html>
<head>
  <title>College Voting Portal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">

    <h1>UNIVOTE</h1>

    <p class="subtitle">
      Secure online voting for college elections
    </p>

    <!-- TABS -->
    <div class="tabs">
      <button type="button" id="loginTab" class="active">
        Login
      </button>

      <button type="button" id="registerTab">
        Register
      </button>
    </div>

    <!-- FORM -->
    <form id="authForm">

      <!-- USERNAME (REGISTER ONLY) -->
      <div id="usernameContainer" style="display:none;">

        <label>Username</label>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
        >

      </div>

      <!-- EMAIL -->
      <label>Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter college email"
        required
      >

      <!-- PASSWORD -->
      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <!-- CONFIRM PASSWORD -->
      <div id="confirmPasswordContainer" style="display:none;">

        <label>Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
        >

      </div>

      <!-- SUBMIT -->
      <button class="main-btn" id="submitBtn" type="submit">
        Login
      </button>

    </form>

    <p class="small-text" id="infoText">
      Login with your registered account
    </p>

  </div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const supabase = window.supabase.createClient(
    "https://soiufzbqvwillwockoro.supabase.co",
    "sb_publishable_7bi7bDV6XBm37pzcxtn7uw_CrMmwuw1"
  );

  // ================= AUTO SESSION CHECK =================
  (async () => {
    const { data } = await supabase.auth.getSession();
    if (data.session) {
      window.location.href = "dashboard.html";
    }
  })();

  // ================= ELEMENTS =================
  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");

  const usernameContainer = document.getElementById("usernameContainer");
  const confirmContainer = document.getElementById("confirmPasswordContainer");

  const submitBtn = document.getElementById("submitBtn");
  const infoText = document.getElementById("infoText");

  const usernameInput = document.getElementById("username");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const confirmPasswordInput = document.getElementById("confirmPassword");

  let mode = "login";

  // ================= TAB SWITCH =================
  function setMode(newMode) {

    mode = newMode;

    loginTab.classList.remove("active");
    registerTab.classList.remove("active");

    if (newMode === "login") {

      loginTab.classList.add("active");

      usernameContainer.style.display = "none";
      confirmContainer.style.display = "none";

      submitBtn.innerText = "Login";

      infoText.innerText =
        "Login with password OR use magic link (email only)";
    }

    if (newMode === "register") {

      registerTab.classList.add("active");

      usernameContainer.style.display = "block";
      confirmContainer.style.display = "block";

      submitBtn.innerText = "Register";

      infoText.innerText =
        "Create your student voting account";
    }

    passwordInput.value = "";
    confirmPasswordInput.value = "";
  }

  loginTab.addEventListener("click", (e) => {
    e.preventDefault();
    setMode("login");
  });

  registerTab.addEventListener("click", (e) => {
    e.preventDefault();
    setMode("register");
  });

  setMode("login");

  // ================= FORM SUBMIT =================
  document.getElementById("authForm")
  .addEventListener("submit", async (e) => {

    e.preventDefault();

    const username = usernameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!email) {
      alert("Fill email");
      return;
    }

    // ================= REGISTER =================
    if (mode === "register") {

      if (!username) {
        alert("Enter username");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match");
        return;
      }

      const { error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { username }
        }
      });

      if (error) {
        alert(error.message);
        return;
      }

      alert("Registration successful! Please login.");
      setMode("login");
      return;
    }

    // ================= LOGIN WITH PASSWORD =================
    if (password) {

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        alert("Invalid login credentials");
        return;
      }

      window.location.href = "dashboard.html";
      return;
    }

    // ================= MAGIC LINK LOGIN (NEW) =================
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: window.location.origin + "/dashboard.html"
      }
    });

    if (error) {
      alert(error.message);
      return;
    }

    alert("Magic link sent! Check your email 📩");

  });

});
</script>

</body>
</html>
